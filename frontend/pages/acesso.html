<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolPassReader | Registrar Acesso</title>
    <!-- CSS Global -->
    <link rel="stylesheet" href="../style/global.css">
    <!-- CSS de Formulários -->
    <link rel="stylesheet" href="../style/cadastrar.css">
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="main-header">
            <h1 class="brand-title">Registrar Acesso</h1>
            <p class="brand-subtitle">Entrada e saída automática dos alunos</p>
        </header>

        <!-- MAIN -->
        <main class="main-content flex-center">
            <div class="form-card">
                <form id="formAcesso" action="#" method="POST" class="form-container">
                    
                    <div class="form-row" style="grid-template-columns: 1fr 2fr;">
                        <div class="form-group">
                            <label for="tipoBusca">Buscar por</label>
                            <select id="tipoBusca" name="tipoBusca">
                                <option value="matricula">Matrícula</option>
                                <option value="nome">Nome</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="identificador">Identificação do Aluno</label>
                            <input type="text" id="identificador" name="identificador" placeholder="Digite a matrícula ou nome..." required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">Registrar</button>
                    
                    <a href="index.html" class="btn-back">← Voltar ao início</a>
                </form>
            </div>
        </main>
    </div>

    <!-- FOOTER -->
    <footer class="main-footer">
        <p>SchoolPassReader &copy; 2026 • Desenvolvido para <span>Inova Week SENAI</span></p>
    </footer>

</body>
</html>
