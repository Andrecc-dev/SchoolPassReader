<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolPassReader | Cadastrar Aluno</title>
    <!-- CSS Global -->
    <link rel="stylesheet" href="../style/global.css">
    <!-- CSS de Formulários -->
    <link rel="stylesheet" href="../style/cadastrar.css">
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="main-header">
            <h1 class="brand-title">Cadastro de Aluno</h1>
            <p class="brand-subtitle">Registre novos alunos no sistema</p>
        </header>

        <!-- MAIN -->
        <main class="main-content flex-center">
            <div class="form-card">
                <form id="formCadastro" action="#" method="POST" class="form-container">
                    
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite o nome do aluno" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="idade">Idade</label>
                            <input type="number" maxlength="3" id="idade" name="idade" placeholder="Ex: 16" min="1" max="100" required>
                        </div>
                        <div class="form-group">
                            <label for="turma">Turma</label>
                            <input type="text" id="turma" name="turma" placeholder="Ex: 3º Ano A" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="matricula">Número da Matrícula / ID</label>
                        <input type="number" maxlength="8" id="matricula" name="matricula" placeholder="Digite ou passe a carteirinha no leitor..." required>
                    </div>

                    <button type="submit" class="btn-submit">Finalizar Cadastro</button>
                    
                    <a href="index.html" class="btn-back">← Voltar ao início</a>
                </form>
            </div>
        </main>
    </div>

    <!-- FOOTER -->
    <footer class="main-footer">
        <p>SchoolPassReader &copy; 2026 • Desenvolvido para <span>Inova Week SENAI</span></p>
    </footer>

</body>
</html>
