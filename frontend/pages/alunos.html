<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolPassReader | Alunos Cadastrados</title>
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/tabelas.css">
</head>
<body>

    <div class="app-container">
        <header class="main-header">
            <h1 class="brand-title">Alunos Cadastrados</h1>
            <p class="brand-subtitle">Lista de alunos registrados no sistema</p>
        </header>

        <main class="main-content">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Pesquisar aluno por nome ou matrícula...">
                <button class="btn-search">Buscar</button>
            </div>

            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Turma</th>
                            <th>Matrícula</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>André Cunha Correa</td>
                            <td>18</td>
                            <td>3º Dev Sistemas</td>
                            <td>20260101</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="page-actions">
                <a href="index.html" class="btn-back" style="text-align: left;">← Voltar ao início</a>
            </div>
        </main>
    </div>

    <footer class="main-footer">
        <p>SchoolPassReader &copy; 2026 • Desenvolvido para <span>Inova Week SENAI</span></p>
    </footer>

</body>
</html>
