<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Relatório de Acessos</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='style_relatorio_acessos.css') }}">

</head>

<body>

    <div class="container">

        <h1>Relatório de Acessos</h1>

        <p class="subtitulo">

            Entradas e saídas registradas no sistema

        </p>

        <form method="GET" class="pesquisa">

    <input
        type="text"
        name="busca"
        placeholder="Pesquisar acesso..."
    >

    <button type="submit">

        Buscar

    </button>

        </form>

        <table>

            <thead>

                <tr>

                    <th>Nome</th>

                    <th>Turma</th>

                    <th>Matrícula</th>

                    <th>Tipo</th>

                    <th>Horário</th>

                </tr>

            </thead>

            <tbody>

                {% for acesso in relatorio %}

                    <tr>

                        <td>{{ acesso[0] }}</td>

                        <td>{{ acesso[1] }}</td>

                        <td>{{ acesso[2] }}</td>

                        <td>{{ acesso[3] }}</td>

                        <td>{{ acesso[4] }}</td>

                    </tr>

                {% endfor %}

            </tbody>

        </table>

        <a href="/" class="voltar">

            Voltar ao início

        </a>

    </div>

</body>

</html>
