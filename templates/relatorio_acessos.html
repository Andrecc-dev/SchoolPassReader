<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Acessos - SchoolPassReader</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style_global.css') }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style_relatorio_acessos.css') }}">
</head>

<body>

    <div class="container">

        <h1>Relatório de Acessos</h1>
        <p class="subtitulo">Entradas e saídas registradas no sistema</p>

        <form method="GET" class="pesquisa-container" autocomplete="off">
            <input 
                type="text" 
                name="busca" 
                placeholder="Pesquisar acesso por nome, matrícula ou tipo..."
                class="input-pesquisa"
                value="{{ request.args.get('busca', '') }}"
            >
            <button type="submit" class="btn-buscar">Buscar</button>
        </form>

        <div class="table-wrapper">
            <table class="tabela-acessos">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Turma</th>
                        <th>Matrícula</th>
                        <th>Tipo</th>
                        <th>Horário</th>
                    </tr>
                </thead>
                <tbody>
                    {% for acesso in relatorio %}
                        <tr>
                            <td class="nome-aluno">{{ acesso[0] }}</td>
                            <td><span class="badge-turma">{{ acesso[1] }}</span></td>
                            <td class="codigo-matricula">{{ acesso[2] }}</td>
                            <td>
                                <span class="badge-movimentacao {% if 'ent' in acesso[3]|lower %}tipo-entrada{% else %}tipo-saida{% endif %}">
                                    {{ acesso[3] }}
                                </span>
                            </td>
                            <td class="horario-registro">{{ acesso[4] }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <a href="/" class="btn-voltar">Voltar ao início</a>

    </div>

</body>

</html>
