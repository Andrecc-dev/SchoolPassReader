<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Alunos</title>
</head>

<body>

    <h1>Lista de Alunos</h1>

    {% for aluno in alunos %}

        <p>
            {{ aluno[0] }} -
            {{ aluno[1] }} -
            {{ aluno[2] }} anos -
            Turma {{ aluno[3] }}
        </p>

    {% endfor %}

    <a href="/">
        <button>Voltar</button>
    </a>

</body>
</html>
