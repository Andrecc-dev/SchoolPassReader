<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos Cadastrados - SchoolPassReader</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style_global.css') }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style_alunos.css') }}">
</head>

<body>

    <div class="container">

        <h1>Alunos Cadastrados</h1>
        <p class="subtitulo">Lista de alunos registrados no sistema</p>

        <form method="GET" class="pesquisa-container" autocomplete="off">
            <input 
                type="text" 
                name="busca" 
                placeholder="Pesquisar aluno por nome ou matrícula..."
                class="input-pesquisa"
                value="{{ request.args.get('busca', '') }}"
            >
            <button type="submit" class="btn-buscar">Buscar</button>
        </form>

        <div class="table-wrapper">
            <table class="tabela-alunos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Turma</th>
                        <th>Matrícula</th>
                    </tr>
                </thead>
                <tbody>
                    {% for aluno in alunos %}
                        <tr>
                            <td>{{ aluno[0] }}</td>
                            <td class="nome-aluno">{{ aluno[1] }}</td>
                            <td>{{ aluno[2] }}</td>
                            <td><span class="badge-turma">{{ aluno[3] }}</span></td>
                            <td class="codigo-matricula">{{ aluno[4] }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <a href="/" class="btn-voltar">Voltar ao início</a>

    </div>

</body>

</html>
