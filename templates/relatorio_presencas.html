<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Relatório de Presenças</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='style_relatorio_presencas.css') }}">

</head>

<body>

    <div class="container">

        <h1>Relatório de Presenças</h1>

        <p class="subtitulo">

            Presenças acadêmicas registradas

        </p>

        <form method="GET" class="pesquisa">

    <input
        type="text"
        name="busca"
        placeholder="Pesquisar presença..."
    >

    <button type="submit">

        Buscar

    </button>

        </form>

        <table>

            <thead>

                <tr>

                    <th>Nome</th>

                    <th>Turma</th>

                    <th>Matrícula</th>

                    <th>Data</th>

                    <th>Presença</th>

                </tr>

            </thead>

            <tbody>

                {% for presenca in relatorio %}

                    <tr>

                        <td>{{ presenca[0] }}</td>

                        <td>{{ presenca[1] }}</td>

                        <td>{{ presenca[2] }}</td>

                        <td>{{ presenca[3] }}</td>

                        <td>

                        {% if presenca[4] == 1 %}

                            Presente

                        {% else %}

                            Ausente

                        {% endif %}

                        </td>

                    </tr>

                {% endfor %}

            </tbody>

        </table>

        <a href="/" class="voltar">

            Voltar ao início

        </a>

    </div>

</body>

</html>
